aid: axena-health
name: Axena Health
description: 'Axena Health, Inc. is a Waltham, Massachusetts women''s health medical
  device company whose flagship product is the Leva Pelvic Health System, an FDA-cleared
  prescription digital therapeutic that pairs a vaginal motion sensor with a mobile
  app to deliver supervised pelvic floor muscle training for stress, mixed and mild-to-moderate
  urgency urinary incontinence and chronic fecal incontinence. Leva is prescribed by
  clinicians, dispensed to patients through telehealth and specialty channels, and
  is reimbursed through commercial health plans and federal channels including the
  Veterans Health Administration. Axena Health ships software only as a regulated
  end-user product: as of this profile it operates no developer portal, no public API
  reference, no SDKs and no partner integration program. The only machine-readable
  surfaces reachable without credentials are the default WordPress REST API on its two
  marketing sites and an OAuth-protected WordPress MCP Adapter endpoint on levacares.com.'
